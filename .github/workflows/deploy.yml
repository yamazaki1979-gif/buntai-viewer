name: deploy
on: [push, workflow_dispatch]
permissions:
  pages: write
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir site
          cp index.html model.meta.json scene_extra.json site/
          cd site
          curl -fL "https://drive.usercontent.google.com/download?id=1P8bFyF0xqFVgVIAqbKIqCgElV4qb0OxH&export=download&confirm=t" -o model-aef34958.p0.wasm
          curl -fL "https://drive.usercontent.google.com/download?id=1-qmfcqOODJVlrms_JNYnWx81uwBoHSlg&export=download&confirm=t" -o model-aef34958.p1.wasm
          curl -fL "https://drive.usercontent.google.com/download?id=1CVvcgO5tHbR_VVQLQ7BPeT30hJD-jSm5&export=download&confirm=t" -o model-aef34958.p2.wasm
          touch .nojekyll
          ls -la
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
